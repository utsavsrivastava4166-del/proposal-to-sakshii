<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 Ek Bahut Zaroori Sawaal 💕</title>
<style>
:root {
  --bg: #0a0010;
  --glow1: #ff2d78;
  --glow2: #b84fff;
  --glow3: #ff85c1;
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,100,200,0.25);
  --text: #fff5fb;
  --sub: #d9a8d0;
  --btn-gradient: linear-gradient(135deg, #ff2d78, #b84fff);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Georgia',serif;background:var(--bg);color:var(--text);user-select:none;}

#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.18;animation:drift 18s ease-in-out infinite alternate;}
.ab1{width:600px;height:600px;background:#ff2d78;top:-200px;left:-100px;animation-duration:20s;}
.ab2{width:500px;height:500px;background:#b84fff;bottom:-150px;right:-100px;animation-duration:25s;animation-delay:-8s;}
.ab3{width:400px;height:400px;background:#ff85c1;top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:15s;animation-delay:-4s;}
@keyframes drift{0%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-30px) scale(1.05);}66%{transform:translate(-20px,40px) scale(0.95);}100%{transform:translate(30px,20px) scale(1.02);}}

#hearts-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.fheart{position:absolute;bottom:-60px;font-size:1.4rem;animation:floatUp linear infinite;opacity:0;}
@keyframes floatUp{0%{transform:translateX(0) rotate(0deg);opacity:0;bottom:-60px;}10%{opacity:0.7;}90%{opacity:0.5;}100%{transform:translateX(var(--drift)) rotate(360deg);opacity:0;bottom:110vh;}}

.burst{position:fixed;pointer-events:none;z-index:999;}
.burst-heart{position:absolute;font-size:1.5rem;animation:burstAnim 0.9s ease-out forwards;}
@keyframes burstAnim{0%{transform:translate(0,0) scale(0);opacity:1;}60%{opacity:1;}100%{transform:translate(var(--bx),var(--by)) scale(1.2);opacity:0;}}

#app{position:relative;z-index:10;width:100%;height:100%;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;opacity:0;pointer-events:none;transition:opacity 0.7s ease,transform 0.7s ease;transform:scale(0.96) translateY(12px);overflow-y:auto;overflow-x:hidden;}
.screen.active{opacity:1;pointer-events:all;transform:scale(1) translateY(0);}
.screen.exit{opacity:0;transform:scale(1.04) translateY(-12px);}

.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:28px;padding:36px 32px 32px;max-width:500px;width:100%;backdrop-filter:blur(20px);box-shadow:0 0 60px rgba(255,45,120,0.12),0 8px 32px rgba(0,0,0,0.4);text-align:center;position:relative;}
.card::before{content:'';position:absolute;inset:-1px;border-radius:28px;background:linear-gradient(135deg,rgba(255,45,120,0.35),rgba(184,79,255,0.15),rgba(255,133,193,0.2));z-index:-1;pointer-events:none;}

.step-label{font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--glow3);opacity:0.7;margin-bottom:12px;}
.card h2{font-size:clamp(1.15rem,4vw,1.55rem);line-height:1.3;color:#fff;text-shadow:0 0 20px rgba(255,45,120,0.5);margin-bottom:10px;}
.card p{color:var(--sub);font-size:clamp(0.88rem,3vw,1.02rem);line-height:1.75;margin-bottom:14px;}
.emoji-big{font-size:clamp(3rem,12vw,5rem);display:block;margin-bottom:12px;animation:wobble 2s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-4deg) scale(1);}50%{transform:rotate(4deg) scale(1.06);}}

.btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;position:relative;min-height:52px;}
.btn-yes,.btn-no{
  background:var(--btn-gradient);
  color:#fff;border:none;
  padding:14px 38px;border-radius:50px;
  font-size:1.05rem;font-family:inherit;
  cursor:pointer;
  box-shadow:0 0 24px rgba(255,45,120,0.5),0 4px 16px rgba(0,0,0,0.3);
  transition:transform 0.15s,box-shadow 0.15s;
  white-space:nowrap;
}
.btn-yes:hover{transform:scale(1.07);box-shadow:0 0 40px rgba(255,45,120,0.75),0 6px 20px rgba(0,0,0,0.3);}
.btn-yes:active{transform:scale(0.96);}
.btn-no.floating{position:fixed;z-index:500;}
.btn-no.in-flow{position:static;}

/* Q4 — static buttons, no escape */
.btn-no.static-btn{position:static !important;cursor:default;}

.dots{display:flex;gap:8px;justify-content:center;margin-bottom:24px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);transition:background 0.4s,transform 0.4s;}
.dot.done{background:var(--glow1);transform:scale(1.3);box-shadow:0 0 8px var(--glow1);}

#confetti-canvas{position:fixed;inset:0;z-index:5;pointer-events:none;}
.heart-rain{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden;}
.rain-h{position:absolute;top:-60px;font-size:1.8rem;animation:rainDrop linear infinite;opacity:0;}
@keyframes rainDrop{0%{top:-60px;opacity:0;}10%{opacity:1;}90%{opacity:0.8;}100%{top:110vh;opacity:0;}}

.success-title{font-size:clamp(1.8rem,7vw,2.8rem);background:linear-gradient(135deg,#ff2d78,#ff85c1,#b84fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.25;margin-bottom:14px;animation:pulseGlow 2s ease-in-out infinite alternate;}
@keyframes pulseGlow{from{filter:drop-shadow(0 0 10px rgba(255,45,120,0.5));}to{filter:drop-shadow(0 0 30px rgba(184,79,255,0.8));}}

.success-body{color:#f0c0d8;font-size:clamp(0.88rem,2.8vw,1rem);line-height:1.85;margin-top:10px;white-space:pre-line;}

.sparkle{position:fixed;pointer-events:none;z-index:9999;font-size:1rem;animation:sparkleAnim 0.7s ease-out forwards;}
@keyframes sparkleAnim{0%{opacity:1;transform:scale(0) rotate(0deg);}60%{opacity:1;transform:scale(1.3) rotate(180deg);}100%{opacity:0;transform:scale(0.8) rotate(360deg) translateY(-30px);}}
</style>
</head>
<body>

<div id="aurora">
  <div class="aurora-blob ab1"></div>
  <div class="aurora-blob ab2"></div>
  <div class="aurora-blob ab3"></div>
</div>
<div id="hearts-bg"></div>
<canvas id="confetti-canvas"></canvas>
<div class="heart-rain" id="heart-rain"></div>
<div id="app"></div>

<script>
/* ============================================
   DATA
   ============================================ */
const STEPS = [
  {
    label: "Sawaal 1 / 4",
    emoji: "🐱",
    title: "Ek second… kuch poochna tha 🥺",
    body: "Kya tujhe mujhpe thoda sa bhi bharosa hai?",
    note: "(Soch ke bol. Bahut important hai yeh.)",
    yesLabel: "Haan bilkul! 💖",
    noLabels: ["Nahi 😒","Hmm… shayad nahi 🙄","Maine maana badal liya!","BACHAO 😭"],
    escaping: true
  },
  {
    label: "Sawaal 2 / 4",
    emoji: "🙈",
    title: "Okay okay, ek aur cheez…",
    body: "Kya main thoda bahut cute lagta hoon tujhe?",
    note: "(Jhooth mat bol. Actually bol. Bas haan bol.)",
    yesLabel: "Bahut hi zyada cute 😍",
    noLabels: ["Nahi 😒","Pakka nahi? 🥺","Dobara soch ❤️","Yes dabaao 😂"],
    escaping: true
  },
  {
    label: "Sawaal 3 / 4",
    emoji: "😊",
    title: "Almost ho gaya… ek aur cheez —",
    body: "Kabhi meri wajah se bina wajah muskura deti hai?",
    note: "(Teri aankhon ne pehle hi haan bol diya 👀)",
    yesLabel: "Hamesha 🥰",
    noLabels: ["Nahi 😒","Sach mein nahi? 🥺","Ek baar soch ❤️","lol nahi toh 😭"],
    escaping: true
  },
  {
    label: "Sawaal 4 / 4",
    emoji: "🫀",
    title: "Ek last chiz bolna chahta hun…",
    body: `Hum dono sirf 1-2 mahine se ek dusre ko jaante hain, aur abhi bahut kuch jaana baaki hai. Par pata nahi kyun, tere saath ek alag hi khushi milti hai.

Mujhe tujhe dekhte hi pyaar nahi hua tha, lekin ek strong intuition tha ki mujhe tujhse bahut jaldi pyaar ho jayega... aur dekh, ho gaya.

Aur sach kahun, agar tu aaj mujhe reject bhi kar de, toh main kal aur zyada pyaar aur khud mein aur behtar changes lekar phir try karunga. Chahe tu mujhe 1000 baar reject kare, main 1001vi baar bhi try karunga.

I love you, Sakshi 🫀`,
    note: "",
    yesLabel: "Haan 💕",
    noLabels: ["Nahi 💔"],
    escaping: false
  }
];

const SUCCESS = {
  emoji: "💞",
  title: "Tune haan bol diya… 🫀",
  body: `Dekh, tunne jo bhi kaha mujhe nahi pata — mujhme itni himat nahi thi ki main tujhe bol paun, toh maine yeh kiya.

Dekh, maine aaj tak 2 ladkiyon ko propose kiya hai aur dono ne reject kiya hai. Aur ab agar tune bhi mujhe haan kar diya toh... tera shukriya. Dil se.

I love you, Sakshi 🫀
— Utsav`
};

/* ============================================
   FLOATING HEARTS
   ============================================ */
(function(){
  const c=document.getElementById('hearts-bg');
  const items=['💗','💕','✨','💫','🌸','💖','⭐','🌷'];
  for(let i=0;i<18;i++){
    const h=document.createElement('div'); h.className='fheart';
    h.textContent=items[Math.floor(Math.random()*items.length)];
    h.style.cssText=`left:${Math.random()*100}%;font-size:${0.8+Math.random()*1.2}rem;--drift:${(Math.random()-0.5)*80}px;animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*15}s;`;
    c.appendChild(h);
  }
})();

/* ============================================
   SPARKLE
   ============================================ */
document.addEventListener('click',e=>{
  if(e.target.classList.contains('btn-no')) return;
  spawnSparkle(e.clientX,e.clientY);
});
function spawnSparkle(x,y){
  const s=document.createElement('div'); s.className='sparkle';
  s.textContent=['✨','💫','⭐','🌟'][Math.floor(Math.random()*4)];
  s.style.left=x+'px'; s.style.top=y+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),700);
}

/* ============================================
   BURST
   ============================================ */
function burstHearts(x,y){
  const items=['💕','💗','💖','💞','✨','🌸','💓'];
  for(let i=0;i<14;i++){
    const b=document.createElement('div'); b.className='burst';
    b.style.left=x+'px'; b.style.top=y+'px';
    const h=document.createElement('div'); h.className='burst-heart';
    h.textContent=items[Math.floor(Math.random()*items.length)];
    const angle=Math.random()*360, dist=80+Math.random()*120;
    h.style.setProperty('--bx',Math.cos(angle*Math.PI/180)*dist+'px');
    h.style.setProperty('--by',Math.sin(angle*Math.PI/180)*dist+'px');
    h.style.animationDelay=Math.random()*0.15+'s';
    b.appendChild(h); document.body.appendChild(b);
    setTimeout(()=>b.remove(),1100);
  }
}

/* ============================================
   NO BUTTON ESCAPE
   ============================================ */
let moveCooldown = false;

function attachNoEscape(btn, labels, escaping){
  btn.textContent = labels[0];
  if(!escaping){
    btn.classList.add('static-btn');
    return;
  }
  let labelIdx = 0;

  function teleport(){
    if(moveCooldown) return;
    moveCooldown = true;
    setTimeout(()=>moveCooldown=false, 100);

    btn.classList.remove('in-flow');
    btn.classList.add('floating');

    const bw=btn.offsetWidth||130, bh=btn.offsetHeight||50, m=16;
    btn.style.left=(m+Math.random()*(window.innerWidth-bw-m*2))+'px';
    btn.style.top=(m+Math.random()*(window.innerHeight-bh-m*2))+'px';
    btn.style.right='auto'; btn.style.bottom='auto';

    labelIdx=Math.min(labelIdx+1,labels.length-1);
    btn.textContent=labels[labelIdx];
  }

  btn.addEventListener('mouseenter', teleport);
  btn.addEventListener('mousemove',  teleport);
  btn.addEventListener('touchstart', e=>{ e.preventDefault(); teleport(); },{passive:false});
}

/* ============================================
   BUILD SCREENS
   ============================================ */
const app = document.getElementById('app');

function buildDots(activeIdx){
  let h='<div class="dots">';
  for(let i=0;i<STEPS.length;i++) h+=`<div class="dot${i<=activeIdx?' done':''}"></div>`;
  return h+'</div>';
}

STEPS.forEach((s,i)=>{
  const div=document.createElement('div');
  div.className='screen'; div.id=`screen-${i}`;
  div.innerHTML=`
    ${buildDots(i)}
    <div class="card">
      <div class="step-label">${s.label}</div>
      <span class="emoji-big">${s.emoji}</span>
      <h2>${s.title}</h2>
      <p style="white-space:pre-line;">${s.body}</p>
      ${s.note?`<p style="opacity:0.5;font-size:0.82rem;font-style:italic;">${s.note}</p>`:''}
      <div class="btn-row" id="btnrow-${i}">
        <button class="btn-yes" id="yes-${i}">${s.yesLabel}</button>
        <button class="btn-no in-flow" id="no-${i}">${s.noLabels[0]}</button>
      </div>
    </div>`;
  app.appendChild(div);
});

// success screen
const sd=document.createElement('div');
sd.className='screen'; sd.id='screen-success';
sd.innerHTML=`
  <div class="card" style="max-width:520px;">
    <span class="emoji-big" style="animation-duration:1s;">${SUCCESS.emoji}</span>
    <div class="success-title">${SUCCESS.title}</div>
    <p class="success-body">${SUCCESS.body}</p>
    <div style="margin-top:24px;font-size:2.2rem;animation:wobble 1.5s ease-in-out infinite;">💕🎉💕</div>
  </div>`;
app.appendChild(sd);

// wire buttons
STEPS.forEach((s,i)=>{
  document.getElementById(`yes-${i}`).addEventListener('click',function(e){
    burstHearts(e.clientX,e.clientY);
    setTimeout(()=>goTo(i<STEPS.length-1?i+1:'success'),300);
  });
  attachNoEscape(document.getElementById(`no-${i}`), s.noLabels, s.escaping);
});

/* ============================================
   NAVIGATION
   ============================================ */
function goTo(id){
  const prev=document.querySelector('.screen.active');
  if(prev){ prev.classList.add('exit'); prev.classList.remove('active'); setTimeout(()=>prev.classList.remove('exit'),750); }
  document.querySelectorAll('.btn-no.floating').forEach(b=>{
    b.classList.remove('floating'); b.classList.add('in-flow');
    b.style.left=''; b.style.top='';
  });
  const next=typeof id==='number'?document.getElementById(`screen-${id}`):document.getElementById('screen-success');
  setTimeout(()=>{ next.classList.add('active'); if(id==='success') startCelebration(); },100);
}

goTo(0);

/* ============================================
   CELEBRATION
   ============================================ */
function startCelebration(){
  const rain=document.getElementById('heart-rain');
  const rItems=['💕','💗','💖','💞','🌸','✨','💫'];
  for(let i=0;i<22;i++){
    const h=document.createElement('div'); h.className='rain-h';
    h.textContent=rItems[Math.floor(Math.random()*rItems.length)];
    h.style.left=Math.random()*100+'%';
    h.style.fontSize=(1+Math.random()*1.5)+'rem';
    h.style.animationDuration=(3+Math.random()*4)+'s';
    h.style.animationDelay=(-Math.random()*4)+'s';
    rain.appendChild(h);
  }
  const canvas=document.getElementById('confetti-canvas');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const colors=['#ff2d78','#ff85c1','#b84fff','#ffe082','#fff','#80cfff'];
  const pieces=[];
  for(let i=0;i<180;i++) pieces.push({x:Math.random()*canvas.width,y:-Math.random()*canvas.height*0.5,r:4+Math.random()*7,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,vx:(Math.random()-0.5)*4,vy:2+Math.random()*4,vr:(Math.random()-0.5)*6,shape:Math.random()<0.5?'rect':'circle'});
  let frame;
  (function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.globalAlpha=0.88;
      if(p.shape==='rect') ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      else{ctx.beginPath();ctx.arc(0,0,p.r/2,0,Math.PI*2);ctx.fill();}
      ctx.restore();
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      if(p.y>canvas.height+20){p.y=-20;p.x=Math.random()*canvas.width;}
    });
    frame=requestAnimationFrame(draw);
  })();
  setTimeout(()=>{cancelAnimationFrame(frame);ctx.clearRect(0,0,canvas.width,canvas.height);},8000);
  try{
    const ac=new AudioContext();
    [261.6,329.6,392,523.3,659.3].forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;
      const t=ac.currentTime+i*0.18;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.18,t+0.05);g.gain.exponentialRampToValueAtTime(0.001,t+0.8);
      o.start(t);o.stop(t+0.8);
    });
  }catch(e){}
}

window.addEventListener('resize',()=>{
  const c=document.getElementById('confetti-canvas');
  c.width=window.innerWidth;c.height=window.innerHeight;
});
</script>
</body>
</html>
